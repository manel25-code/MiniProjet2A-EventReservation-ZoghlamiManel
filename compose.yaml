services:
  php:
    build:
      context: .
      dockerfile: dockerfile
    container_name: event_php
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - DATABASE_URL=mysql://user:password@db:3306/event_reservation
      - JWT_PASSPHRASE=votre_passphrase_secrete
      - APP_DOMAIN=localhost
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: event_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: event_db
    environment:
      MYSQL_DATABASE: event_reservation
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data: